sitename: Fundor333 Dot Com
description: Fundor 333's personal space on the web
image: /img/pilogo.jpg
logo: /img/logo.png
images:
  - /img/Opengraph.png
# Favicons — point at files that exist under static/ (CyberLavandaTea theme).
favicon: "/favicon.ico"
faviconSvg: "/icons/favicon.svg"
appleTouchIcon: "/icons/apple-touch-icon.png"
icon96: "/favicon-96x96.png"
webmanifest: "/icons/site.webmanifest"
icon: "/favicon-196x196.png" # generic site icon, also used by the feeds
defaultColor:
  "dark" # set color mode: dark, light, auto
  # Setting it to 'auto' applies the color scheme based on the visitor's device color preference.If you don't specify anything, ignore this parameter, or leave it blank,
  # the default value is set to 'auto'.
  # You can take a look at layouts/index.html for more information.
mainSections: ["post", "photos", "now", "micro"]
secondarysections: []
feedSections: ["post", "photos", "micro", "weeknote"]
commentSections: ["post", "photos", "micro", "weeknote", "series"]
suggestionSections: ["post"]
toc: false # set to false to disable table of contents 'globally'
tocOpen: false # set to true to open table of contents by default
goToTop: true # set to false to disable 'go to top' button
additionalScripts: []
  # Will try to load 'assets/js/custom.js' and 'assets/js/custom-2.js'.
  # Your custom scripts will be concatenated to one file `custom.js`.
  # When building for production it will be minified.
  # The file `custom.js` is loaded on each page (before body tag ends).
dateFormat:
  "2 January 2006" # default date format used on various pages
  # See https://gohugo.io/functions/format/#hugo-date-and-time-templating-reference for available date formats.
rssFeedDescription:
  "summary" # available options: 1) summary 2) full
  # summary - includes a short summary of the blog post in the RSS feed. Generated using Hugo .Summary .
  # full - includes full blog post in the RSS feed. Generated using Hugo .Content .
  # By default (or if nothing is specified), summary is used.

socialIcons:
  - name: "github"
    url: "https://github.com/fundor333"
  - name: "facebook"
    url: "https://www.facebook.com/fundor333"
  - name: "mastodon"
    url: "https://mastodon.social/@fundor333"
  - name: "youtube"
    url: "https://www.youtube.com/channel/UC7SGz-dENnmAueXXjP0Ki2A"
  - name: "instagram"
    url: "https://www.instagram.com/fundor333/"
  - name: "kofi"
    url: "https://ko-fi.com/fundor333"
  - name: "codeberg"
    url: "https://codeberg.org/fundor333"

author:
  avatar: "img/logo.png" # put the file in assets folder; also ensure that image has same height and width
  # Note: image is not rendered if the resource(avatar image) is not found. No error is displayed.
  intro: "Fundor 333's personal space on the web"
  name: "Fundor333"
  description: "Pythonista, Backend Developer, Photographer, Dev Ops, Ex-Scout, Bookworm and Tea Lover. Sometime you can find me in a GDG, a DataBeers, a Pycon, a Comicon or other similar event. Huge Open Source fan and user I am allways searching something new to do or to study. Huge fan of automation, autodeploy, data sharing and bots. A lot of my personal stuff are here in my blog and some in my Github."
  fediverseAccount: "@fundor333@mastodon.social"
  url: "https://fundor333.com"

Hcard:
  avatar: "img/logo.png"
  fullName: Fundor333
  pronouns:
    nominative: he
    oblique: him
    possessive: his
  nickname: F333
  city: Venice
  region: Ve
  country: IT
  # Footer h-card toggles (CyberLavandaTea): each block shows only when its
  # data is present AND its toggle isn't false.
  showPronouns: true
  showLocation: true
  showStatus: true
  # status: "open to freelance"     # short status line in the footer h-card
  # statusUrl: ""                    # optional link for the status

bridgy:
  - "mastodon"
  - "bluesky"

# Font Awesome (icone per tipo di contenuto nel tema CyberLavandaTea).
# Kit Pro già usato in precedenza dal sito.
fontawesome:
  kit: "https://kit.fontawesome.com/2f3b6e2e4c.js"

# Angolo LGBT+ (pride.codes) in alto a destra. Default del tema: false.
prideCorner: true

# Box "Cita questo post". `pronouns` è dedotto da Hcard.pronouns se omesso.
cite:
  enable: true
  body: "Please reference this post with a link to this page."
  name: "Fundor333"
  nameAlt: "Fundor333' Blog"
  learnMoreUrl: "https://fundor333.com/cite"

# Webmention (webmention.io). Il tema rende la facepile + i commenti in
# #webmentions e mette <link rel="webmention"> / <link rel="pingback">.
# `script` omesso -> il tema serve la sua copia bundlata di webmention.js.
webmention:
  targetDomain: "fundor333.com"
  wordcount: 50

# Font della firma "Written by a human" (Ocean Trace, personale — sta in
# static/fonts/). Il tema emette l'@font-face come "Sig Font".
fonts:
  signature: "/fonts/OceanTrace-Personal.ttf"

# Webring nel footer (tema CyberLavandaTea). Erano hardcoded nel vecchio
# layouts/_partials/footer.html; ora sono dati.
webrings:
  - name: "XXIIVV webring"
    url: "https://webring.xxiivv.com/#86"
    icon: "https://webring.xxiivv.com/icon.white.svg"
  - name: "IndieWeb Webring"
    url: "https://xn--sr8hvo.ws"
    prev: "https://xn--sr8hvo.ws/previous"
    next: "https://xn--sr8hvo.ws/next"
  - name: "djangowebring"
    html: '<webring-css site="https://fundor333.com"></webring-css>'
    script: "https://djangowebring.com/static/webring.js"

dateFormatAtomFeed: "2006-01-02T15:04:05-07:00"
dateFormatTag: "2006"
feedUUID: "43c22089-5c06-4cc4-8fd2-5b3563d5d257"

baseURL: "https://fundor333.com"
DefaultContentLanguage: en
locale: en
title: Fundor333
enableRobotsTXT: false
fediverseAccount: "@fundor333@mastodon.social"
ignoreLogs:
  - "warning-goldmark-raw-html"
goToTop: true
disableHugoGeneratorInject: true
enableGitInfo: true

# PROVA (branch feat/cyberlavandatea-theme): tema CyberLavandaTea.
# Per tornare al precedente: theme: ["hugo-redirect", "hugo-blog-awesome"]
# e `git mv layouts.hugo-blog-awesome layouts`.
theme: ["hugo-redirect", "cyberlavandatea"]

related:
  includeNewer: true
  threshold: 70
  toLower: false
  indices:
    - name: categories
      weight: 40
    - name: title
      weight: 30
    - name: description
      weight: 30
    - name: tags
      weight: 10
    - name: meta
      weight: 10
    - name: date
      weight: 10

mediaTypes:
  application/atom+xml:
    suffixes:
      - xml

outputFormats:
  SearchIndex:
    baseName: search
    mediaType: application/json
  Atom:
    mediaType: "application/atom+xml"
    baseName: atom
  humanstxt:
    baseName: humans
    isPlainText: true
    mediaType: text/plain

outputs:
  home:
    - html
    - rss
    - SearchIndex
    - json
    - Atom
    - humanstxt
  section:
    - html
    - rss
    - json
    - Atom

services:
  rss:
    limit: 20

taxonomies:
  series: series
  category: categories
  tag: tags
  theme: themes
  group: group

minify:
  tdewolff:
    html:
      keepDocumentTags: true
      keepQuotes: true

# Necessario a css.TailwindCSS del tema CyberLavandaTea (prova).
# Il layout del tema è CSS puro con fallback delle utility: non serve
# buildStats/hugo_stats.json per renderizzare correttamente.
security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^git$'
      - '^go$'
      - '^node$'
      - '^npx$'
      - '^postcss$'
      - '^tailwindcss$'

baseURL: "https://fundor333.com"
DefaultContentLanguage: en
locale: en
title: Fundor333
enableRobotsTXT: false
fediverseAccount: "@fundor333@mastodon.social"
ignoreLogs:
  - "warning-goldmark-raw-html"
goToTop: true
disableHugoGeneratorInject: true
enableGitInfo: true

# CyberLavandaTea è importato come Hugo Module (vedi module.imports sotto)
# invece che come git submodule in themes/.
theme: ["hugo-redirect"]

module:
  imports:
    - path: github.com/fundor333/cyberlavandatea

related:
  includeNewer: true
  threshold: 70
  toLower: false
  indices:
    - name: categories
      weight: 40
    - name: title
      weight: 30
    - name: description
      weight: 30
    - name: tags
      weight: 10
    - name: meta
      weight: 10
    - name: date
      weight: 10

mediaTypes:
  application/atom+xml:
    suffixes:
      - xml

outputFormats:
  SearchIndex:
    baseName: search
    mediaType: application/json
  Atom:
    mediaType: "application/atom+xml"
    baseName: atom
  humanstxt:
    baseName: humans
    isPlainText: true
    mediaType: text/plain

outputs:
  home:
    - html
    - rss
    - SearchIndex
    - json
    - Atom
    - humanstxt
  section:
    - html
    - rss
    - json
    - Atom

services:
  rss:
    limit: 20

taxonomies:
  series: series
  category: categories
  tag: tags
  theme: themes
  group: group

minify:
  tdewolff:
    html:
      keepDocumentTags: true
      keepQuotes: true

# Richiesto dal tema CyberLavandaTea (non ereditabile dai temi).
markup:
  highlight:
    noClasses: false # highlight con classi .chroma → palette del tema
  goldmark:
    parser:
      # immagine "da sola" → <figure> + <figcaption> (render-image.html)
      wrapStandAloneImageWithinParagraph: false

# Necessario a css.TailwindCSS del tema CyberLavandaTea (prova).
# Il layout del tema è CSS puro con fallback delle utility: non serve
# buildStats/hugo_stats.json per renderizzare correttamente.
security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^git$'
      - '^go$'
      - '^node$'
      - '^npx$'
      - '^postcss$'
      - '^tailwindcss$'

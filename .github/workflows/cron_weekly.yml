name: Cron Weekly

concurrency:
  group: cron-pipeline

on:
  # Testa della catena: la domenica il weekly parte per primo e tutti gli altri
  # workflow del gruppo "cron-pipeline" restano in attesa che finisca.
  # Orari in Europe/Rome, convertiti in UTC (ora solare, +1h in ora legale).
  schedule:
    - cron: "15 5 * * 0" # 06:15 Europe/Rome, domenica
    - cron: "30 22 * * 0" # 23:30 Europe/Rome, domenica
  workflow_dispatch:
jobs:
  # Task di generazione: nel grafo delle Actions è un nodo a sé, con i suoi log
  # e il suo esito, separato dal commit.
  generate:
    name: generate weekly
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@master

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Generate Weekly
        run: make weekly

      - name: Riepilogo esito
        if: always()
        run: |
          echo "- Generate Weekly: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Raccogli le modifiche
        id: collect
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary > changes.patch
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Carica il patch
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: patch-weekly
          path: changes.patch
          if-no-files-found: ignore
          retention-days: 1

  # Applica il patch del task e fa un unico commit.
  # if: always() => gira anche se la generazione è fallita; salta solo se
  # "generate" è stato skippato.
  commit:
    needs: generate
    if: always() && needs.generate.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@master

      - name: Scarica il patch
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: patches
          pattern: patch-*

      - name: Applica il patch
        run: |
          shopt -s nullglob
          applied=0
          for p in patches/*/changes.patch; do
            echo "Applico $p"
            if git apply --3way --whitespace=nowarn "$p"; then
              applied=$((applied + 1))
            else
              echo "::error::Patch non applicabile: $p"
            fi
          done
          echo "Patch applicati: $applied"

      - name: Commit to repository
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          COMMIT_MSG: |
            👾Generate Weekly
            skip-checks: true
        run: |
          git config user.email "git@fundor333.com"
          git config user.name "fundor333"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/fundor333/fundor333.github.io.git
          git checkout main
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "${COMMIT_MSG}"; git push origin main)

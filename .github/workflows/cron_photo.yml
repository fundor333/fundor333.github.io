name: Cron Photo

concurrency:
  group: cron-pipeline

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Cron Automation
    branches:
      - main
    types:
      - completed
jobs:
  # Task di elaborazione: nel grafo delle Actions è un nodo a sé, con i suoi log
  # e il suo esito, separato dal commit.
  photo-exif:
    name: photo exif
    runs-on: ubuntu-latest
    # Aspetta Cron Automation (che la domenica a sua volta aspetta Cron Weekly)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@master

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Fix EXIF foto
        run: uv run python ./action_script/photo_exif.py

      - name: Riepilogo esito
        if: always()
        run: |
          echo "- Photo EXIF: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Raccogli le modifiche
        id: collect
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary > changes.patch
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Carica il patch
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: patch-photo-exif
          path: changes.patch
          if-no-files-found: ignore
          retention-days: 1

  # Applica il patch del task e fa un unico commit.
  # if: always() => gira anche se il task è fallito; salta solo se "photo-exif"
  # è stato skippato (guard workflow_run non superato).
  commit:
    needs: photo-exif
    if: always() && needs.photo-exif.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@master

      - name: Scarica il patch
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: patches
          pattern: patch-*

      - name: Applica il patch
        run: |
          shopt -s nullglob
          applied=0
          for p in patches/*/changes.patch; do
            echo "Applico $p"
            if git apply --3way --whitespace=nowarn "$p"; then
              applied=$((applied + 1))
            else
              echo "::error::Patch non applicabile: $p"
            fi
          done
          echo "Patch applicati: $applied"

      - name: Commit to repository
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          COMMIT_MSG: |
            👾Fix Photo Exif
            skip-checks: true
        run: |
          git config user.email "git@fundor333.com"
          git config user.name "fundor333"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/fundor333/fundor333.github.io.git
          git checkout main
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "${COMMIT_MSG}"; git push origin main)

[project]
name = "fundor333-github-io"
version = "1.0.0"
description = ""
authors = [{ name = "Fundor333", email = "fundor333@fundor333.com" }]
requires-python = "~=3.14.5"
readme = "README.md"
dependencies = [
    "feedparser",
    "requests",
    "python-dotenv",
    "weeknotebot",
    "pillow",
    "beautifulsoup4",
    "pyyaml",
    "lxml",
    "typer[all]",
    "python-frontmatter",
    "bleach",
    "pandas",
    "matplotlib",
    "rich",
    "playwright",
]

[project.entry-points.dotenv]
ignore = "false"
location = ".env"

[dependency-groups]
dev = [
    "hugo-nbconvert>=2025.5.24.3",
    "jupyterlab>=4.4.6",
    "langchain>=0.3.27",
    "langchain-ollama>=0.3.7",
    "pre-commit>=4.1.0,<5",
        "git-cliff>=2.12.0",
]


[tool.ruff]
indent-width = 4
exclude = [".git", "*migrations*", ".tox", ".venv"]
line-length = 119

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "F",   # Regole di Pyflakes
    "W",   # Avvisi di PyCodeStyle
    "E",   # Errori di PyCodeStyle
    "I",   # Ordina correttamente gli import
    "UP",  # Avvisa se alcune cose possono essere modificate a causa di versioni Python più recenti
    "C4",  # Intercetta l'uso scorretto di comprensioni, dizionari, liste, ecc.
    "FA",  # Applica from __future__ import annotations
    "ISC", # Buon uso della concatenazione di stringhe
    "ICN", # Usa le convenzioni di importazione comuni
    "RET", # Buone pratiche di ritorno
    "SIM", # Regole di semplificazione comuni
    "TID", # Alcune buone pratiche di importazione
    "PTH", # Usa pathlib invece di os.path
    "TD",  # Sii diligente con i commenti TODO
    "NPY", # Alcune cose specifiche di numpy
]
ignore = ["ANN002", "ANN003", "RUF012", "PTH120", "B008"]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 18



[tool.git-cliff.changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/docs/#introduction
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## 👨🏻‍💻🧋 Unreleased
{% endif %}\
{% for group, commits in commits | unique(attribute="message") | group_by(attribute="group")   %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim_end }}\
    {% endfor %}
{% endfor %}
"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/docs/#introduction
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[tool.git-cliff.git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.


commit_parsers = [

    { message = ".\\d+\\.\\d+\\.\\d+", skip = true },
    { message = "^Merge '[^']+'", skip = true },
    { message = "Merge", skip = true },
    { message = "^👾", skip = true },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = ".*format code with Black.*", skip = true },

    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^doc", group = "📝 Docs" },
    { message = "^perf", group = "🧰 Improvements" },
    { message = "^refactor", group = "🧰 Improvements" },
    { message = "^style", group = "💄 Style" },
    { message = "^test", group = "🧪 Testing" },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { body = ".*security", group = "🔒 Security" },
    { body = ".*", group = "❓ Other (unconventional)" },
]

# An array of regex based parsers for extracting data from the commit message.filter_unconventional = false
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
# Exclude commits that are not matched by any commit parser.
filter_commits = true
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"

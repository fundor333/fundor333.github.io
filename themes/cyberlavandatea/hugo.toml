# CyberLavandaTea — theme configuration.
#
# NOTE: Hugo merges only SOME keys from a theme's config (params, related,
# services, mediaTypes, build). It does NOT merge `outputs`, `outputFormats`,
# `taxonomies`, `security`, `markup`: put those in the SITE config — see
# README, "Minimal site configuration" (a copy-paste block, identical to
# themes/cyberlavandatea/exampleSite/hugo.toml).
# ---------------------------------------------------------------------------

[module]
  [module.hugoVersion]
    min = "0.146.0"

# --- Tailwind v4 via css.TailwindCSS ---------------------------------------
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = '(assets/notwatching/hugo_stats|hugo_stats)\.json'
    target = 'css'
  [[build.cachebusters]]
    source = 'assets/css/.*\.css'
    target = 'css'

# --- Related ("See Also" block) -----------------------------------------
[related]
  includeNewer = true
  threshold = 70
  toLower = false
  [[related.indices]]
    name = 'categories'
    weight = 40
  [[related.indices]]
    name = 'tags'
    weight = 30
  [[related.indices]]
    name = 'title'
    weight = 20
  [[related.indices]]
    name = 'date'
    weight = 10

[mediaTypes.'application/atom+xml']
  suffixes = ['xml']

[services.rss]
  limit = 20

# --- Markup -------------------------------------------------------------------
# Hugo does NOT merge [markup] from a theme: set this in the SITE config.
#   markup.highlight.noClasses = false
#     -> highlighting uses .chroma classes, coloured by the theme palette
#        (assets/css/main.css). With true, Chroma emits inline Monokai styles
#        and the violet/green palette is NOT applied.
#   markup.goldmark.parser.wrapStandAloneImageWithinParagraph = false
#     -> a lone image becomes <figure> with a <figcaption> from its title.
# See README, "Minimal site configuration".

# --- Theme default params ------------------------------------------------
[params]
  colorScheme = 'dark'          # the theme is ALWAYS dark
  mainSections = ['post']
  secondarysections = ['micro']
  feedSections = ['post', 'micro', 'photos', 'weeknote']
  commentSections = ['post', 'micro', 'photos', 'weeknote']
  suggestionSections = ['post']
  toc = true
  tocOpen = false
  goToTop = true
  dateFormat = '2 January 2006'
  rssFeedDescription = 'summary'
  homeRecentCount = 20
  linkUTM = false
  writtenByHuman = true
  shareButtons = true
  cite = true
  badges88x31 = true
  prideCorner = false          # LGBTQ+ corner (pride.codes) — opt-in

  # Font Awesome for the content-type icons (postCard, single-page headers).
  # With `kit` a Kit is loaded (Pro too); otherwise the free cdnjs CSS.
  [params.fontawesome]
    # kit = "https://kit.fontawesome.com/xxxxxxxxxx.js"
    version = "6.7.2"
    disable = false

  # Per-type icon override: postIcons.<type> = "<FA classes>"
  # [params.postIcons]
  #   post = "fa-solid fa-newspaper"

  [params.fonts]
    display = 'Audiowide'
    body = 'Rajdhani:wght@400;500;600;700'

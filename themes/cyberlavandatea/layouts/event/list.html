{{ define "main" }}
<main class="wrapper py-8" aria-label="{{ T "content" }}">
  <header class="mb-6">
    <h1 class="text-center">{{ .Title }}</h1>
    {{ with .Content }}<div class="e-content mt-4">{{ . }}</div>{{ end }}
  </header>
  {{ range (.Pages.GroupByParamDate "start" "2006").Reverse }}
  <h2 class="post-year mt-8 text-inactive">{{ .Key }}</h2>
  <div class="post-list">{{ range .Pages.ByParam "start" }}{{ partial "postCard.html" . }}{{ end }}</div>
  {{ end }}
</main>
{{ end }}

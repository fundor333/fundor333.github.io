{{- /* Hook di estensione: il sito può creare layouts/_partials/custom-head.html
       per aggiungere <link>, meta di verifica, webmention/pingback, ecc.
       Questo file del tema è un no-op di default. */ -}}
{{ with site.Params.webmention }}
<link rel="webmention" href="{{ .endpoint | default (printf "https://webmention.io/%s/webmention" .targetDomain) }}">
<link rel="pingback" href="{{ .pingback | default (printf "https://webmention.io/%s/xmlrpc" .targetDomain) }}">
{{ end }}

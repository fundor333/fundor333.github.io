{{- $img := "" -}}
{{- with .Params.image }}{{ $img = . | absURL }}{{ else }}{{ with .Resources.GetMatch "{cover,feature}.{png,jpg,jpeg,webp}" }}{{ $img = .Permalink }}{{ end }}{{ end -}}
<script type="application/ld+json">
{{ dict
  "@context" "https://schema.org"
  "@type" "BlogPosting"
  "headline" .Title
  "description" (.Params.description | default (.Summary | plainify))
  "datePublished" (.PublishDate.Format "2006-01-02T15:04:05Z07:00")
  "dateModified" (.Lastmod.Format "2006-01-02T15:04:05Z07:00")
  "url" .Permalink
  "mainEntityOfPage" .Permalink
  "image" (cond (ne $img "") $img nil)
  "author" (dict "@type" "Person" "name" (site.Params.author.name | default site.Title) "url" (site.Params.author.url | default site.BaseURL))
  "publisher" (dict "@type" "Organization" "name" site.Title "url" site.BaseURL)
  "keywords" (delimit (.Params.tags | default slice) ", ")
  "wordCount" .WordCount
  | jsonify (dict "indent" "  ") }}
</script>

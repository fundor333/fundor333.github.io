{{- with .Params.syndication -}}
<div class="syndication mt-6 border-t border-border pt-4 text-sm">
  <strong>{{ T "syndication.also_on" }}</strong>
  {{ range $i, $u := . }}{{ if $i }}, {{ end }}<a class="u-syndication" rel="syndication" href="{{ $u }}" target="_blank" rel="noopener">{{ (urls.Parse $u).Host }}</a>{{ end }}
</div>
{{- end -}}

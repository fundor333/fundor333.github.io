{{- $action := "" -}}
{{- with site.GetPage "/search" }}{{ $action = .RelPermalink }}{{ end -}}
{{- if not $action }}{{ $action = "/search/" | relLangURL }}{{ end -}}
<form id="search" role="search" method="get" action="{{ $action }}"
  class="my-6 flex gap-2">
  <label for="search-input" class="sr-only">{{ T "search.label" }}</label>
  <input type="search" id="search-input" name="q" autocomplete="off"
    placeholder="{{ T "search.placeholder" }}"
    class="w-full rounded border border-border bg-surface px-3 py-2 text-content">
  <button type="submit" class="btn">{{ T "search.submit" }}</button>
</form>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-example-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exampleSite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tailwind CLI
        run: npm install

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.146.0"
          extended: true

      - name: Build exampleSite
        run: hugo --gc --minify --environment production

baseURL = "https://example.org/"
languageCode = "en-us"
title = "CyberLavandaTea — demo"
theme = "cyberlavandatea"
enableGitInfo = false

[pagination]
  pagerSize = 10

# --- Config NOT inherited from the theme: replicate it in your site ---------
# (outputs, outputFormats, mediaTypes, taxonomies, markup, security).
# Copy this block into your own config when you use the theme.
# See README, "Minimal site configuration".
[taxonomies]
  series = "series"
  category = "categories"
  tag = "tags"
  theme = "themes"
  group = "group"

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.SearchIndex]
  baseName = "search"
  mediaType = "application/json"
  isPlainText = true
[outputFormats.Atom]
  baseName = "atom"
  mediaType = "application/atom+xml"
[outputFormats.humanstxt]
  baseName = "humans"
  mediaType = "text/plain"
  isPlainText = true

[outputs]
  home = ["html", "rss", "json", "SearchIndex", "Atom", "humanstxt"]
  section = ["html", "rss", "json", "Atom"]

[services.rss]
  limit = 20

# --- Menu ---------------------------------------------------------------
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "Blog"
    url = "/post/"
    weight = 20
  [[menu.main]]
    name = "Micro"
    url = "/micro/"
    weight = 30
  [[menu.main]]
    name = "Now"
    url = "/now/"
    weight = 40
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 90

# --- Params -----------------------------------------------------------------
[params]
  description = "CyberLavandaTea demo — a dark, violet + green Hugo theme for dev blogs."
  dateFormat = "2 January 2006"
  linkUTM = false
  themeColor = "#1e1e24"
  prideCorner = true            # LGBTQ+ corner (theme default: false)
  # Font Awesome: with no kit set, the free cdnjs CSS is used (content-type icons).

  [params.author]
    name = "Dev Person"
    intro = "Backend, Hugo, tea."
    description = "An example dev blog for CyberLavandaTea."
    url = "https://example.org/"

  [params.hcard]
    fullName = "Dev Person"
    showLocation = true
    city = "Venice"
    country = "IT"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/"
  [[params.socialIcons]]
    name = "mastodon"
    url = "https://mastodon.social/"

  [[params.webrings]]
    name = "XXIIVV webring"
    url = "https://webring.xxiivv.com/"
    icon = "https://webring.xxiivv.com/icon.white.svg"
  [[params.webrings]]
    name = "IndieWeb Webring"
    url = "https://xn--sr8hvo.ws"
    prev = "https://xn--sr8hvo.ws/previous"
    next = "https://xn--sr8hvo.ws/next"

# --- Markup ---------------------------------------------------------------
[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

# --- Security: required for css.TailwindCSS (not inherited from the theme) --
[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^git$', '^go$', '^node$', '^npx$', '^postcss$', '^tailwindcss$']
